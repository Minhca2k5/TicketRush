server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketrush}
    username: ${DB_USERNAME:minh}
    password: ${DB_PASSWORD:minh123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  event-service-url: ${EVENT_SERVICE_URL:http://localhost:8082}
  mail:
    from: ${MAIL_FROM:${spring.mail.username:no-reply@ticketrush.local}}
