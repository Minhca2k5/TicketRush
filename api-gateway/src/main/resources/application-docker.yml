server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
        - id: event-service
          uri: http://event-service:8082
          predicates:
            - Path=/api/events/**,/api/dashboard/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/booking/**
        - id: queue-service
          uri: http://queue-service:8084
          predicates:
            - Path=/api/queue/**

jwt:
  secret: ticketrushJwtSecretKeyMustBeAtLeastThirtyTwoBytesLong2026

chatbot:
  event-service:
    base-url: http://event-service:8082
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  rag:
    document-paths: ${CHATBOT_RAG_DOCUMENTS:/app/rag-docs/ARCHITECTURE.md,/app/rag-docs/TicketRush-Roadmap.md,/app/rag-docs/CONVENTIONS.md,/app/rag-docs/docker-compose.yml}
