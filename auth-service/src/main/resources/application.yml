server:
  port: 8081

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: minh
    password: minh123
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SMTP_TIMEOUT:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:5000}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}

jwt:
  secret: ticketrushJwtSecretKeyMustBeAtLeastThirtyTwoBytesLong2026
  expiration: 86400000  # 24 hours

app:
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:no-reply@ticketrush.local}}
  email:
    require-mx-record: ${EMAIL_REQUIRE_MX_RECORD:true}
  verification:
    code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:1}
    max-failed-attempts: ${VERIFICATION_MAX_FAILED_ATTEMPTS:5}
  seed:
    admin:
      username: admin
      password: admin123
      email: admin@ticketrush.local
